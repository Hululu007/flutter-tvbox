name: Flutter Android APK

# Flutter 双端工程（NewTv 改造版）的 Android 出包流水线。
# 产物：Artifacts → NewTv-android-apk（已签名，adb install 直接装）

on:
  # 只留手动触发。这个仓库是用 Contents API 逐文件上传的，每次 PUT 都产生一个 commit，
  # 开着 push 自动触发会在批量上传时一次刷出几百个 run，把 Actions 队列堵死。
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不用 android-actions/setup-android：它固定去装已废弃的 "tools" 包，
      # 在 ubuntu-latest 上必然 exit 1。镜像本身已带 SDK。
      - name: Locate Android SDK
        run: |
          for d in /usr/local/lib/android/sdk "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
            if [ -d "$d/cmdline-tools" ]; then SDK="$d"; break; fi
          done
          [ -n "${SDK:-}" ] || { echo "✗ 没找到 Android SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      # libnode.so 有 60MB，不放仓库，构建前现拉。
      # 同时铺到 jniLibs（打包进 APK）和 cpp/libnode（CMake 链接与头文件）
      - name: Fetch libnode (nodejs-mobile)
        run: |
          chmod +x tools/fetch_libnode.sh
          ./tools/fetch_libnode.sh
          echo "--- jniLibs ---"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/  2>/dev/null || { echo "✗ arm64 jniLibs 没生成"; exit 1; }
          ls -lh android/app/src/main/jniLibs/x86_64/    2>/dev/null || { echo "✗ x86_64 jniLibs 没生成"; exit 1; }

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      # screen_brightness_android 2.1.5 的 build.gradle 顶层写了 kotlin{}，
      # 在 AGP 9.0.1 + Kotlin 2.3.20 下子项目没有这个扩展，直接报
      # "Could not find method kotlin()"。这个脚本把它删掉（jvmTarget 已由根
      # build.gradle.kts 的 subprojects 统一设成 17，不会丢配置）。
      - name: Patch incompatible plugin gradle
        run: python3 tools/patch_flutter_plugins.py

      # --split-per-abi 按 ABI 拆成独立 APK，每个只带自己那份 libnode：
      #   app-arm64-v8a-release.apk    真机（约 55MB）
      #   app-armeabi-v7a-release.apk  老设备
      #   app-x86_64-release.apk       MuMu/雷电模拟器
      # 模拟器的 ARM 转译层跑不动 libnode 的 V8，起 node 必崩，
      # 必须用原生 x86_64 包。
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm,android-x64

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NewTv-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
